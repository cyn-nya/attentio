<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Attentio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a26" />
      <stop offset="1" stop-color="#0b0f14" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80" />
      <stop offset="0.55" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Three rings narrowing onto a point: attention converging. -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="26" opacity="0.28" />
  <circle cx="256" cy="256" r="116" fill="none" stroke="url(#ring)" stroke-width="30" opacity="0.62" />
  <circle cx="256" cy="256" r="64" fill="none" stroke="url(#ring)" stroke-width="34" />

  <circle cx="256" cy="256" r="26" fill="#e8f4ff" />

  <!-- A single tick escaping the rings: the task actually finished. -->
  <path
    d="M318 150 L352 184 L424 106"
    fill="none"
    stroke="#4ade80"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
