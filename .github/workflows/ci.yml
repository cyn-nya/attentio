name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that supersedes an in-flight run makes that run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The collector is Win32 FFI, so the honest place to test it is Windows.
    # The pure packages would pass on Linux; the point of this job is that the
    # thing which actually reads the machine is exercised.
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Only test what can be installed. Node 24 is the floor: node:sqlite and
        # running .ts directly both landed there.
        node: ['24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        # `prepare` builds packages and the dashboard, so this also proves that a
        # fresh clone needs no extra step.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: The collector check itself works
        # The Linux and macOS jobs trust this tool. Run it on Windows as well, so a
        # broken check fails loudly instead of passing everywhere by accident.
        run: npm run test:collector

      - name: Dashboard render checks
        run: npm run test:web

      - name: Build
        run: npm run build

      - name: Check the dashboard actually serves
        # The static host is hand-written, so "it builds" is not the same as
        # "it serves". This starts the daemon and asserts the real responses.
        shell: bash
        run: |
          set -euo pipefail
          node --conditions=development --disable-warning=ExperimentalWarning \
            packages/cli/src/index.ts start > server.log 2>&1 &
          for i in $(seq 1 30); do
            grep -qE 'localhost:[0-9]+' server.log && break
            sleep 1
          done
          PORT=$(grep -oE 'localhost:[0-9]+' server.log | head -1 | cut -d: -f2)
          if [ -z "$PORT" ]; then
            echo "the daemon never reported a URL"; cat server.log; exit 1
          fi
          echo "daemon listening on $PORT"
          curl -fsS "http://127.0.0.1:$PORT/api/health" | head -c 400
          echo
          curl -fsS "http://127.0.0.1:$PORT/" | grep -q 'id="root"'
          # A missing asset must 404 rather than being answered with the shell.
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/assets/nope.js")" = "404"
          echo "dashboard serves correctly"

  # The Linux and macOS collectors cannot be started on the machine Attentio is
  # developed on, so "implemented" was unverifiable. This runs their real code —
  # reading /proc, spawning ps and xprop — on the platforms they target.
  #
  # What it can prove is limited and the limitations are deliberate: a CI runner is
  # headless, so no window is focused and nothing is idle, and the check asserts the
  # sample *shapes* rather than any particular value. That still catches the failure
  # that actually happens — an import that throws, a subprocess that no longer
  # exists, a field that moved — which is the difference between a collector that is
  # wrong and one that is absent.
  collectors:
    name: collectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install
        # --ignore-scripts: this job needs the daemon's source, not the dashboard
        # bundle or the native Windows dependency.
        run: npm ci --ignore-scripts

      - name: The collector starts and returns sane samples
        run: npm run test:collector

      - name: Typecheck on this platform
        # Cheap, and it catches platform-specific type errors such as a narrowing of
        # process.platform that only compiles where the branch is reachable.
        run: npm run typecheck

      - name: The full node suite on this platform
        # The live collector tests inside this skip themselves off Windows, so what
        # runs here is the pure logic plus whatever this platform can support.
        run: npm test

  # The dashboard is the only thing here with an installable bundle, so it is the
  # only thing worth checking on a second platform. Preact and Vite are portable;
  # if the web build breaks on Linux, that is a real portability bug.
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - name: Report bundle size
        run: |
          echo "Bundle size:"
          du -h apps/web/dist/assets/* | sort -h
